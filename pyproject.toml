[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roost"
version = "2.0.0b1"
description = "Personal AI team for Claude users: each bot gets its own computer. Self-hosted, encrypted at rest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.8",
    "cryptography>=42",
    "websockets>=13",
    "httpx>=0.27",
    # Official Anthropic Claude Agent SDK — drives the "claude" model mode.
    # Pinned exactly (not a floor): see roost/llm/registry.py for why model
    # ids never get hardcoded anywhere else.
    "claude-agent-sdk==0.2.170",
    # roost/gateway/auth.py (carried from LazyClaw) hashes passwords with it.
    "bcrypt",
    # roost/bots/roles.py parses role files' YAML front matter (MIT).
    "pyyaml>=6.0.3",
    # roost/tasks/nl_time.py (harvested) reads natural-language dates (Apache-2.0/BSD-3).
    "python-dateutil>=2.8.2",
    # roost/tasks/recurrence.py (harvested) validates and steps cron recurrence (MIT).
    "croniter>=1.3.0",
    # roost/documents/pdf_ops.py (harvested): page counts and PDF structure (BSD-3-Clause).
    "pypdf>=4.0.0",
    # roost/documents/pdf_ops.py (harvested): text out of a PDF (MIT).
    "pdfplumber>=0.11.0",
    # roost/documents/pdf_ops.py (harvested): a PDF made from a doc's text (BSD).
    "reportlab>=4.0.0",
    # roost/computer_use/look.py and roost/desk/ready.py: masked screenshots, crops and the ready probe
    # (MIT-CMU / HPND, approved 2026-10-21).
    "pillow>=12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
include = ["roost*"]

[tool.setuptools.package-data]
"roost.db" = ["schema.sql"]
"roost.bots" = ["roles/*.md"]
"roost.keeper.seccomp" = ["*.json", "*.license"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "desk: launches real Brave",
    "docker: needs Docker",
    "network: needs internet",
]
addopts = "-m 'not desk and not docker and not network'"
